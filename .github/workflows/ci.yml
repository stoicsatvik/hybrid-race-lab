name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eas.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo-doctor
      - run: npx tsc --noEmit
