name: Core CI

on:
  pull_request:
    paths:
      - 'src/core/**'
      - 'scripts/run-core-checks.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/core-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/**'
      - 'scripts/run-core-checks.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/core-ci.yml'

jobs:
  verify-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:core
      - run: npx tsc --noEmit
